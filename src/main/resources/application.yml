server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/vietqr_demo?useSSL=false&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
  jpa:
    hibernate:
      # Chi kiem tra cau truc bang, khong tu sua. File db/vietqr_schema.sql la nguon chuan duy nhat.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        # Moc thoi gian luu va doc deu theo UTC, tranh lech gio giua may local (+07) va Aiven (UTC)
        jdbc:
          time_zone: UTC

vietqr:
  username: ${VIETQR_USERNAME:customer-phmminhhiu-user26685}
  password: ${VIETQR_PASSWORD:Y3VzdG9tZXItcGhtbWluaGhpdS11c2VyMjY2ODU=}
  base-url: ${VIETQR_BASE_URL:https://dev.vietqr.org/vqr/api}

# Tài khoản admin đăng nhập vào API
admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:Admin@123}

# JWT
jwt:
  secret: ${JWT_SECRET:vietqr-demo-super-secret-key-32-chars-min-required-2024}
  expiration-ms: 86400000
  # VietQR Callback — username/password app TỰ ĐỊNH NGHĨA, báo cho VietQR biết
vietqr-callback:
  username: ${VIETQR_CALLBACK_USERNAME:vqr-callback-user}
  password: ${VIETQR_CALLBACK_PASSWORD:vqr-callback-Pass@123}
  secret: ${VIETQR_CALLBACK_SECRET:vietqr-callback-token-secret-key-32-chars-minimum-2024}
  expiration-seconds: 300

logging:
  level:
    com.demo.vietqr: DEBUG